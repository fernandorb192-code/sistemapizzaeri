<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido • Eri Lanches</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#0e1116;color:#e8edf4;
  min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(420px,100%);background:#151a21;border:1px solid #2a3340;border-radius:20px;padding:28px 22px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);text-align:center}
.card .logo{font-size:52px;margin-bottom:10px}
.card h1{font-size:22px;margin-bottom:6px}
.card .muted{color:#8b98a9;font-size:13px;margin-bottom:18px}
.card .line{display:flex;justify-content:space-between;padding:9px 0;border-top:1px dashed #2a3340;font-size:14px}
.card .total{font-size:18px;font-weight:800;color:#25c26e;border-top:1px solid #2a3340;margin-top:6px;padding-top:10px}
.items{text-align:left;background:#1c232c;border:1px solid #2a3340;border-radius:12px;padding:12px;margin:14px 0}
.item{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed #2a3340}
.item:last-child{border-bottom:0}
.badge{display:inline-block;background:#3a8ffd;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
.error{color:#ff5a3c;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🍕</div>
  <h1 id="store">Eri Lanches</h1>
  <p class="muted">Obrigado pela preferência!</p>
  <div id="status"></div>
  <div id="content"></div>
</div>
<script>
const SUPABASE_URL = 'https://rhyhgjjkjeggfvnillnc.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Ud6dDCvayV663s9eztomqQ_vGnub2OK';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const money = n => 'R$ ' + Number(n || 0).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

(async function(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) { $('#status').innerHTML = '<p class="error">Pedido não encontrado.</p>'; return; }

  const { data: order } = await sb.from('orders').select('*').eq('id', id).single();
  if (!order) { $('#status').innerHTML = '<p class="error">Pedido não encontrado.</p>'; return; }

  const { data: items } = await sb.from('order_items').select('*').eq('order_id', id);

  const statusMap = { recebido:'Recebido', producao:'Em produção', pronto:'Pronto', entrega:'Em rota', finalizado:'Finalizado', cancelado:'Cancelado', aberto:'Aberto' };
  $('#status').innerHTML = `<span class="badge">${statusMap[order.status] || order.status}</span>
    <div class="line"><span>Pedido</span><b>#${order.numero}</b></div>
    <div class="line"><span>Data</span><b>${new Date(order.created_at).toLocaleString('pt-BR')}</b></div>
    ${order.cliente_nome ? `<div class="line"><span>Cliente</span><b>${esc(order.cliente_nome)}</b></div>` : ''}`;

  let html = '<div class="items">';
  html += '<div class="item" style="font-weight:700;color:#8b98a9"><span>Item</span><span style="text-align:right">Total</span></div>';
  (items || []).forEach(i => {
    html += `<div class="item"><span>${i.qtd}x ${esc(i.nome)}${i.observacao ? ' <small class="muted">('+esc(i.observacao)+')</small>' : ''}</span><span>${money(i.total)}</span></div>`;
  });
  html += '</div>';

  html += `<div class="line"><span>Subtotal</span><b>${money(order.subtotal)}</b></div>`;
  if (Number(order.desconto)) html += `<div class="line"><span>Desconto</span><b>-${money(order.desconto)}</b></div>`;
  if (Number(order.taxa_entrega)) html += `<div class="line"><span>Entrega</span><b>${money(order.taxa_entrega)}</b></div>`;
  if (Number(order.taxa_servico)) html += `<div class="line"><span>Serviço</span><b>${money(order.taxa_servico)}</b></div>`;
  html += `<div class="line total"><span>TOTAL</span><b>${money(order.total)}</b></div>`;
  $('#content').innerHTML = html;
})();
</script>
</body>
</html>
